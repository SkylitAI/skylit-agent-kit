name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test with synthetic fixtures
        run: python -m unittest discover -s tests -v
      - name: Check syntax
        run: python -m compileall -q skylit_agent_kit tests
      - name: Verify reproducible example
        run: |
          python -m skylit_agent_kit sample > /tmp/skylit-demo.md
          diff -u examples/expected-brief.md /tmp/skylit-demo.md
      - name: Validate config template
        run: python -c 'import pathlib,tomllib; tomllib.loads(pathlib.Path("agents/codex/config.example.toml").read_text())'
